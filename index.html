  <title>Ficha Cyberpunk</title>
  <style>

    *{box-sizing:border-box} html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(135deg,transparent 45%,rgba(244,230,0,.025) 60%,transparent 75%),repeating-linear-gradient(0deg,transparent,transparent 44px,rgba(255,255,255,.015) 45px)}

    .implant{border:1px solid var(--stroke);border-radius:var(--radius);background:var(--surface);padding:15px;margin-bottom:10px}.implant h3{font-size:14px;margin:0 0 4px}.implant small{font-size:11px;color:var(--muted)}.implant-top{display:flex;justify-content:space-between;gap:15px}.tier-wrap{display:flex;gap:5px;align-items:center;margin-top:13px;flex-wrap:wrap}.tier-dot{min-width:32px;height:31px;border:1px solid var(--stroke);color:var(--muted);background:var(--surface2);border-radius:5px;font-weight:850;font-size:12px;padding:0 6px}.tier-dot.selected{background:var(--yellow);color:#000;border-color:var(--yellow)}.tier-dot.past{border-color:#5f5c20;color:#f1e899}.effect-list{margin:10px 0 0;display:grid;gap:7px;padding-left:14px;color:#d1d5d9;font-size:12px;line-height:1.4}.effect-list li::marker{color:var(--yellow)}.next-tier{margin-top:12px;background:#272916;border:1px solid #585526;padding:10px;border-radius:7px;font-size:12px;color:#d9d6ae}

    .combat-head{background:linear-gradient(110deg,#212219,#14181d);border:1px solid #77701e;border-radius:12px;padding:16px;margin-bottom:12px}.round-number{font-size:39px;font-weight:900;line-height:1}.combat-implant{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--stroke)}.combat-implant:last-child{border:0}.combat-implant .title{font-weight:800;font-size:13px}.combat-implant .sub{font-size:11px;color:var(--muted);margin-top:3px}.combat-implant .buttonish{display:flex;gap:5px;align-items:center}.resource-card{padding:15px;border:1px solid var(--stroke);background:var(--surface);border-radius:11px}.resource-card .number{font-size:28px;font-weight:900}.resource-card h3{margin:0;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.stat-footer{font-size:12px;color:var(--muted);margin-top:7px}.resource-buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.select-roll{display:grid;grid-template-columns:1fr auto;gap:8px}.roll-result{border:1px solid #555f6b;border-radius:11px;padding:17px;text-align:center;margin-top:12px}.roll-dice{font-size:43px;font-weight:900;line-height:1.2}.roll-status{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;font-weight:850}.roll-result.good{border-color:#2c9c61;background:#173422}.roll-result.crit{border-color:var(--yellow);background:#343411}.roll-result.fail{border-color:#814a52;background:#351a21}.roll-result.fumble{border-color:var(--red);background:#5e1925}.check-row{display:flex;align-items:center;gap:9px;cursor:pointer;padding:10px 0}.check-row input{width:18px;height:18px;accent-color:var(--yellow);flex:0 0 auto}.check-row span{font-size:12px;color:#d1d5d9}
    .bottom-nav{position:fixed;z-index:50;bottom:0;left:0;right:0;display:flex;align-items:stretch;justify-content:center;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#101317f7;border-top:1px solid #3d444c;backdrop-filter:blur(15px);box-shadow:0 -15px 32px #0008}.tab-button{border:0;background:transparent;color:#7f8994;padding:9px 6px;display:grid;gap:4px;justify-items:center;font-size:10px;flex:1;max-width:180px;min-width:0;font-weight:750}.tab-button svg{width:21px;height:21px}.tab-button.active{color:var(--yellow)}.tab-button.active span{color:var(--white)}.empty{font-size:12px;color:var(--muted);padding:20px;text-align:center}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222b29;border:1px solid #4a7b6a;color:#c4ffde;border-radius:9px;padding:10px 16px;font-size:12px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;min-width:180px;text-align:center}.toast.show{opacity:1}
    @media(min-width:760px){.app{padding:0 26px 80px}.bottom-nav{position:sticky;top:0;bottom:auto;max-width:1000px;margin:auto;border:1px solid #454b50;border-radius:12px;padding:5px;box-shadow:none;z-index:50}.hero{padding:26px}.hero h2{font-size:43px}.desktop-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start}.desktop-grid .card{margin-bottom:0}.heading{margin-top:32px}.grid.four{grid-template-columns:repeat(4,1fr)}}@media(max-width:390px){.app{padding-left:11px;padding-right:11px}.tile{padding:11px}.tile strong.big{font-size:25px}.grid.three{gap:7px}.field-grid{gap:8px}.btn{padding:9px 10px}.skill-row,.skill-headers{grid-template-columns:minmax(0,1fr) 58px 60px 48px}}

    .skill-row{grid-template-columns:minmax(0,1fr) 64px 56px 46px;align-items:start}.skill-headers{grid-template-columns:minmax(0,1fr) 64px 56px 46px}.skill-note{color:var(--muted)}

    .custom-skill{display:grid;gap:6px}.custom-skill input{text-align:left;font-weight:800}.pair{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}.pair select{padding:5px;font-size:13px;width:auto}

  </style>

<body>
<div class="app">
  <header class="mast">
    <div class="brand"><div class="brand-mark" id="brandMark">?</div><div><div class="eyebrow">ARCHIVO DE PERSONAJE</div><h1><span id="brandName"></span><span class="yellow">_</span></h1></div></div>
    <span class="version">BUILD 03 / OFFLINE</span>
  </header>
  <div class="hero" data-mark="// ?"><div class="hero-main"><div class="eyebrow">NIGHT CITY</div><h2 id="heroName"></h2><p class="subtitle" id="heroSub"></p><div class="tag-row" id="heroTags"></div></div></div>

    <button class="tab-button active" data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/></svg><span>Ficha</span></button>
    <button class="tab-button" data-tab="habilidades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l16 16M4 4l4 1-3 3M20 4L4 20M20 4l-4 1 3 3"/><path d="M5 15l4 4m6 0 4-4"/></svg><span>Habilidades</span></button>
    <button class="tab-button" data-tab="combate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l6 4v7c0 5-3 8-6 9-3-1-6-4-6-9V6z"/><path d="M9 12h6M12 9v6"/></svg><span>Combate</span></button>
    <button class="tab-button" data-tab="implantes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 1v5m6-5v5M9 18v5m6-5v5M1 9h5m-5 6h5m12-6h5m-5 6h5"/></svg><span>Implantes</span></button>
    <button class="tab-button" data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0116 0v3"/></svg><span>Perfil</span></button>
  </nav>
  <section class="panel active" id="tab-resumen"></section>
  <section class="panel" id="tab-habilidades"></section>
  <section class="panel" id="tab-combate"></section>
  <section class="panel" id="tab-implantes"></section>
  <section class="panel" id="tab-perfil"></section>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
