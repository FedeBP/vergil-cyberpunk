    `<div class="card"><div class="field-grid">${inputField('Personaje','name',state.name,'type="text"')}${inputField('Jugador','player',state.player,'type="text"')}${inputField('Nivel','level',state.level,'type="number" min="1" step="1"')}${inputField('Experiencia','exp',state.exp,'type="number" min="0" step="1"')}${inputField('Rol','role',state.role,'type="text"')}<div class="field span"><label>Descripción del rol</label><textarea data-field="roleDesc">${esc(state.roleDesc)}</textarea></div></div></div>`+
    heading('02','Características','Solo se editan los puntos base; los implantes aparecen en +/- automático.')+
    `<div class="card"><div class="grid three">${tile('Puntos ganados',prog.available,`Desde nivel ${state.progression.anchorLevel}`)}${tile('Puntos asignados',prog.spent,'Desde la ficha inicial')}${tile('Saldo',prog.remaining,prog.remaining<0?'Revisar distribución':'Para distribuir',prog.remaining<0?'':'emph')}</div>${prog.remaining<0?'<div class="hint-bubble warn">Hay más puntos asignados que los obtenidos desde la ficha inicial. Verificá si fue un ajuste aprobado o si excediste el presupuesto.</div>':''}<div class="hint-bubble">La distribución inicial del nivel 4 es el punto de partida. Al subir de nivel ganás 10 puntos nuevos; si corregís atributos iniciales, podés actualizar el punto de partida mediante el botón inferior.</div>${ATTRS.map(([id,label])=>mk(id,label)).join('')}<div class="actions" style="margin-top:12px"><button class="btn" data-action="setAnchor">Tomar estos atributos como punto de partida</button></div></div>`+
    heading('03','Defensas calculadas','BASE + +/- automático = TOTAL; sin ajustes manuales.')+
    `<div class="card"><div class="mini-head">DEFENSA <span>BASE &nbsp;&nbsp; +/- &nbsp;&nbsp; TOTAL</span></div>${defenses}</div>`+
    heading('04','Características secundarias','Fórmulas automáticas, redondeo hacia abajo.')+
    `<div class="card">${sec}</div>`+
    heading('05','Recursos y protección del equipo','Los puntos actuales y la RD del equipo son datos del personaje; no alteran fórmulas.')+
    `<div class="card"><div class="field-grid">${inputField('Suerte actual','luck',state.luck,'type="number" min="0" step="1"')}${inputField('Resolución actual','resolution',state.resolution,'type="number" min="0" step="1"')}${inputField('Vitalidad actual','vitality',Math.min(st.hp,state.vitality),'type="number" min="0" step="1"')}${inputField('RD equipo · Normal','armors.normal',state.armors.normal,'type="number" step="1"')}${inputField('RD equipo · Termal','armors.thermal',state.armors.thermal,'type="number" step="1"')}${inputField('RD equipo · Eléctrica','armors.electric',state.armors.electric,'type="number" step="1"')}${inputField('RD equipo · Química','armors.chemical',state.armors.chemical,'type="number" step="1"')}</div><p class="help">Suerte máxima: 50. Resolución máxima: ⌊DET/2⌋. Vitalidad máxima: ⌊CON/2 + DES/5 + 30⌋. Defenzikov y otros implantes se suman automáticamente a RD en combate.</p></div>`+
    heading('06','Méritos y rasgos')+
    `<div class="card"><div class="help" style="margin-bottom:10px">1 mérito por nivel, máximo 10. Las descripciones son notas de mesa.</div>${state.merits.map((m,i)=>`<div class="field" style="margin-bottom:12px"><label>${esc(m.name)}</label><input type="text" data-field="merits.${i}.effect" value="${esc(m.effect)}" placeholder="Efecto / nota"></div>`).join('')}</div>`+
    heading('07','Notas de campaña')+
    `<div class="card"><label class="field">Notas<textarea data-field="notes" placeholder="Equipamiento, historia, recordatorios...">${esc(state.notes)}</textarea></label></div>`+
    heading('08','Datos y copias de seguridad')+
    `<div class="card"><p class="help" style="margin-top:0">Guardado local automático. Para cambiar de teléfono o navegador, exportá un JSON e importalo en el otro.</p><div class="actions"><button class="btn primary" data-action="export">Exportar personaje</button><button class="btn" data-action="import">Importar JSON</button><button class="btn danger" data-action="resetAll">Restablecer ficha</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div>`;
}
function render(tab){const f={resumen:renderResumen,habilidades:renderSkills,combate:renderCombat,implantes:renderImplants,perfil:renderPerfil};if(tab)f[tab]();else Object.values(f).forEach(fn=>fn());}
function fieldUpdate(path,value){
 const allowed=/^(name|player|level|exp|role|roleDesc|notes|vitality|luck|resolution|rollSkill|rollBonus|styleRoll|attrs\.(fue|des|per|int|det|con)|skillMods\.(investigacion|pericia|conocimiento|social|atletismo|sigilo|pelea|punteria|informatica|estilo)|specialties\.(investigacion|pericia|conocimiento|social|atletismo|sigilo|pelea|punteria|informatica|estilo)|armors\.(normal|thermal|electric|chemical)|merits\.[0-9]+\.effect)$/;
 if(!allowed.test(path))return;
 const parts=path.split('.');let obj=state;
 for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];
 const key=parts.at(-1),old=obj[key];
 if(typeof old==='boolean')obj[key]=Boolean(value);
 else if(typeof old==='number')obj[key]=Math.floor(n(value));
 else obj[key]=value;
 if(path==='level')state.level=Math.max(1,Math.floor(state.level));
 if(path.startsWith('attrs.'))state.attrs[key]=Math.max(0,state.attrs[key]);
 if(path==='level'||path.startsWith('attrs.')){
   state.vitality=clamp(state.vitality,0,baseStats().hp);
   state.resolution=clamp(state.resolution,0,baseStats().resolveMax);
 }
 if(path==='vitality')state.vitality=clamp(state.vitality,0,baseStats().hp);
 if(path==='luck')state.luck=clamp(state.luck,0,state.luckMax);
 if(path==='resolution')state.resolution=clamp(state.resolution,0,baseStats().resolveMax);
 save();
}
function advanceTurn(){const c=state.combat;for(let id of ['k','m','d']){if(c[id].active===0&&c[id].cd>0)c[id].cd--;}let kJustEnded=false;for(let id of ['k','m','d']){if(c[id].active>0){c[id].active--;if(c[id].active===0){c[id].cd=cooldown(id==='m'?8:3);if(id==='k')kJustEnded=true}}}if(kJustEnded&&level('defenzikov')>=1&&c.d.cd===0&&c.d.active===0)c.d.active=dDuration();c.round++;save();render('combate')}
function activate(id){let sys=state.combat[id];if(!sys||sys.active||sys.cd)return;if(id==='k'&&level('kerenzikov')>=1)sys.active=kDuration();if(id==='m'&&level('mirror')>=1)sys.active=2;save();render('combate')}
function actionResource(id,delta){const max=id==='vitality'?baseStats().hp:id==='resolution'?baseStats().resolveMax:state.luckMax;state[id]=clamp(n(state[id])+n(delta),0,max);save();render('combate')}
function rollDie(){const selected=skillInfo(state.rollSkill),sty=skillInfo('estilo');let threshold=state.styleRoll?Math.min(selected.total+n(state.rollBonus),sty.total):selected.total+n(state.rollBonus);let crit=state.styleRoll?Math.min(selected.crit,sty.crit):selected.crit;const die=1+Math.floor(Math.random()*100);let status='fail',label='Fallo';if(die>=95){status='fumble';label='Pifia automática'}else if(die>=90){status='fail';label='Fallo automático'}else if(die<=crit){status='crit';label='Crítico'}else if(die<=threshold){status='good';label='Éxito'}state.rollResult={die,threshold,crit,status,label,name:selected.name,styled:state.styleRoll};save();render('combate')}
function handleAction(action,el){const id=el.dataset.id;switch(action){case 'nextTurn':advanceTurn();return;case 'activate':activate(id);return;case 'adjustCD':{let x=state.combat[id];x.cd=Math.max(0,x.cd+n(el.dataset.val));save();render('combate');return}case 'setAnchor':if(confirm('¿Usar nivel y atributos actuales como referencia inicial para los próximos puntos de nivel?')){state.progression={anchorLevel:state.level,anchorAttrs:{...state.attrs}};save();render('perfil');toast('Referencia de puntos actualizada')}return;case 'resetCombat':if(confirm('¿Reiniciar turno y estados activos de implantes?')){state.combat=clone(DEFAULT.combat);save();render('combate')}return;case 'resource':actionResource(id,el.dataset.val);return;case 'resetResolution':state.resolution=baseStats().resolveMax;save();render('combate');return;case 'roll':rollDie();return;case 'tier':{const newLv=n(el.dataset.val),imp=IMPLANTS.find(x=>x.id===id);if(!imp)return;const oldLv=level(id);state.implants[id]=newLv;state.vitality=clamp(state.vitality,0,baseStats().hp);if(oldLv<6&&newLv===6)state.implantLoad[id]=imp.load6;if(oldLv===6&&newLv<6)state.implantLoad[id]=imp.load;save();render('implantes');toast(`${imp.name}: Tier ${newLv}`);return}case 'export':{const blob=new Blob([JSON.stringify({format:'vergil-cyberpunk-v2',exportedAt:new Date().toISOString(),character:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Vergil-ficha-respaldo.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Respaldo exportado');return}case 'import':document.getElementById('importFile')?.click();return;case 'resetAll':if(confirm('¿Borrar todas las modificaciones locales y volver a la ficha inicial?')){state=clone(DEFAULT);save();render();toast('Ficha restablecida')}return;}}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}let go=e.target.closest('[data-goto]');if(go){setTab(go.dataset.goto);return}let act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act)}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='importFile'){const file=t.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());const loaded=obj.character||obj;if(!loaded.attrs||!loaded.implants||!loaded.skillMods)throw Error('Formato inválido');if(!confirm('¿Reemplazar la ficha local por el archivo importado?'))return;state=deepMerge(clone(DEFAULT),loaded);delete state.statsOverride;delete state.reflexIncludesKiroshi;delete state.skillExtra;state.luckMax=50;state.vitality=clamp(state.vitality,0,baseStats().hp);state.resolution=clamp(state.resolution,0,baseStats().resolveMax);save();render();setTab('resumen');toast('Ficha importada')}catch(err){alert('No se pudo importar el archivo. Revisá que sea un respaldo JSON de esta app.')}return}const field=t.dataset.field;if(!field)return;fieldUpdate(field,t.type==='checkbox'?t.checked:t.value);const tab=t.closest('.panel').id.replace('tab-','');render(tab)});
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Sin modo offline automático',err)));
</script>
